services:
  nginx-proxy:
    image: nginx:stable-alpine
    container_name: gate-system-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gate-system-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gate-system-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER wajib diisi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}@postgres:5432/${POSTGRES_DB:-gms}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-GMS_Prod_Secret_Access_Token_Key_2026_Secure_Key_32char}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-GMS_Prod_Secret_Refresh_Token_Key_2026_Secure_Key_32char}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-1h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN wajib diset di produksi}
      - COOKIE_SECURE=true
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=10
      - LOCAL_BACKUP_DIR=/app/backups/local
      - OFFSITE_BACKUP_DIR=/app/backups/nas
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - backups_local:/app/backups/local
      - backups_nas:/app/backups/nas
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    container_name: gate-system-postgres
    restart: unless-stopped
    # ISOLATION HIGH RISK SECURITY FIX: Port 5432/5433 NOT exposed to host network in production.
    # PostgreSQL is accessible ONLY internally by gate-system-backend over docker bridge network.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      - POSTGRES_DB=${POSTGRES_DB:-gms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  uploads:
  backups_local:
  backups_nas:
