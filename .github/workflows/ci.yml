name: GMS Production CI & Security Quality Gate

on:
  push:
    branches: [ main, master, develop, update-v1.0.0, 'update-*' ]
  pull_request:
    branches: [ main, master, develop, update-v1.0.0, 'update-*' ]

jobs:
  backend-verification:
    name: Backend Test, Coverage, Build & Schema Validation (${{ matrix.db_state }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db_state: [fresh, upgraded]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gms_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d gms_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint & TypeScript Type Checking (Check-Only)
        working-directory: ./backend
        run: npm run lint:check

      - name: Generate Prisma Client & Validate Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: |
          npx prisma generate
          npm run prisma:preflight -- --report-only --fail-on-duplicates
          if [ "${{ matrix.db_state }}" = "upgraded" ]; then
            echo "Executing baseline upgrade simulation..."
            npx prisma db execute --file prisma/migrations/20260714030729_init/migration.sql --schema prisma/schema.prisma
            npx prisma migrate resolve --applied 20260714030729_init || true
          fi
          npx prisma migrate deploy

      - name: Verify Migration Checksums (P0-01 Evidence)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: node scripts/check-migration-checksums.js

      - name: Verify Prisma Schema Drift (Zero Drift Gate)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-schema-datasource prisma/schema.prisma --exit-code

      - name: Build Backend Production Bundle
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
        run: npm run build

      - name: Execute Automated Test Suites & Code Coverage Thresholds
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          DATABASE_URL_TEST: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
          BACKUP_SIGNATURE_SECRET: test-backup-signature-secret-for-ci-pipeline-min-32-chars-long
          NODE_ENV: test
        run: npm run test:cov

  frontend-verification:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build (Vite Bundle Check)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Execute Frontend Unit Tests (Vitest)
        working-directory: ./frontend
        run: npm test

  security-vulnerability-audit:
    name: Dependency Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'

      - name: Execute Repository Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Production Security Audit (Backend)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Execute Production Security Audit (Frontend)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

  fullstack-staging-gate:
    name: Full-Stack Staging Stack & Cross-Stack E2E Gate (GBB / GSP / GBJ)
    runs-on: ubuntu-latest
    needs: [backend-verification, frontend-verification]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'

      - name: Verify Full-Stack Docker Stack Boot & API Smoke Gate
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword_staging_gate_ci
          POSTGRES_DB: gms
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
          BACKUP_SIGNATURE_SECRET: test-backup-signature-secret-for-ci-pipeline-min-32-chars-long
          DEFAULT_ADMIN_PASSWORD: test-admin-password-12345
          DEFAULT_QC_PASSWORD: test-qc-password-12345
          DEFAULT_WAREHOUSE_PASSWORD: test-wh-password-12345
          DEFAULT_SECURITY_PASSWORD: test-sec-password-12345
          E2E_API_URL: http://localhost:3001
        run: |
          echo "Initializing full-stack staging gate environment..."
          cp backend/.env.example backend/.env 2>/dev/null || touch backend/.env
          echo "JWT_ACCESS_SECRET=test-jwt-access-secret-for-ci-pipeline-min-32-chars-long" >> backend/.env
          echo "JWT_REFRESH_SECRET=test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long" >> backend/.env
          echo "BACKUP_SIGNATURE_SECRET=test-backup-signature-secret-for-ci-pipeline-min-32-chars-long" >> backend/.env
          docker compose -f docker-compose.yml up -d postgres
          sleep 5
          docker compose -f docker-compose.yml run --rm backend npx prisma migrate deploy
          docker compose -f docker-compose.yml run --rm -e NODE_ENV=test -e SEED_ALL_USERS=true -e DEFAULT_ADMIN_PASSWORD=test-admin-password-12345 -e DEFAULT_QC_PASSWORD=test-qc-password-12345 -e DEFAULT_WAREHOUSE_PASSWORD=test-wh-password-12345 -e DEFAULT_SECURITY_PASSWORD=test-sec-password-12345 backend node dist/prisma/seed.js
          docker compose -f docker-compose.yml up -d --build
          sleep 10
          docker compose ps
          echo "Executing Cross-Stack E2E API & Business Matrix Smoke Verification..."
          node scripts/ci-e2e-smoke.js
          echo "Cross-stack E2E gate passed successfully."
          docker compose down --volumes --remove-orphans


