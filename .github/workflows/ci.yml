name: GMS Production CI & Security Verification (P1-09, P2-06)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-verification:
    name: Backend Test, Lint & Schema Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gms_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint & TypeScript Type Checking
        working-directory: ./backend
        run: npm run lint --if-present

      - name: Generate Prisma Client & Validate Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Execute Automated Test Suites (TDD & SoD Verification)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_SECRET: test-jwt-access-secret-for-ci-pipeline
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline
          NODE_ENV: test
        run: npm test

  frontend-verification:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Verify Frontend Production Build (Vite Bundle Check)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  security-vulnerability-audit:
    name: Dependency Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute npm Security Audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

      - name: Execute npm Security Audit (Frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true
