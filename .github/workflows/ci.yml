name: GMS Production CI & Security Quality Gate

on:
  push:
    branches: [ main, master, develop, update-v1.0.0, 'update-*' ]
  pull_request:
    branches: [ main, master, develop, update-v1.0.0, 'update-*' ]

jobs:
  backend-verification:
    name: Backend Test, Build, Lint & Schema Validation (${{ matrix.db_state }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db_state: [fresh, upgraded]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gms_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint & TypeScript Type Checking (Check-Only)
        working-directory: ./backend
        run: npm run lint:check

      - name: Generate Prisma Client & Validate Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: |
          npx prisma generate
          npm run prisma:preflight -- --report-only --fail-on-duplicates
          if [ "${{ matrix.db_state }}" = "upgraded" ]; then
            echo "Executing baseline upgrade simulation..."
            npx prisma db execute --file prisma/migrations/20260714030729_init/migration.sql --schema prisma/schema.prisma
            npx prisma migrate resolve --applied 20260714030729_init || true
          fi
          npx prisma migrate deploy

      - name: Verify Migration Checksums (P0-01 Evidence)
        if: matrix.db_state == 'upgraded'
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
        run: node ../scripts/check-migration-checksums.js

      - name: Build Backend Production Bundle
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
        run: npm run build

      - name: Execute Automated Test Suites (TDD & SoD Verification)
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          DATABASE_URL_TEST: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
          BACKUP_SIGNATURE_SECRET: test-backup-signature-secret-for-ci-pipeline-min-32-chars-long
          NODE_ENV: test
        run: npm test

      - name: Execute Backend E2E Integration Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          DATABASE_URL_TEST: postgres://postgres:testpassword@localhost:5432/gms_test_db?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-pipeline-min-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-pipeline-min-32-chars-long
          BACKUP_SIGNATURE_SECRET: test-backup-signature-secret-for-ci-pipeline-min-32-chars-long
          NODE_ENV: test
        run: npm run test:e2e --if-present

  frontend-verification:
    name: Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Frontend Production Build (Vite Bundle Check)
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Execute Frontend Unit Tests (Vitest)
        working-directory: ./frontend
        run: npm test --if-present

  security-vulnerability-audit:
    name: Dependency Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute Production Security Audit (Backend)
        working-directory: ./backend
        run: npm audit --omit=dev --audit-level=high

      - name: Execute Production Security Audit (Frontend)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
