# Upstream Backend API Service
upstream backend_service {
    server backend:3001;
    keepalive 32;
}

# Upstream Frontend Web Service
upstream frontend_service {
    server frontend:80;
    keepalive 32;
}

# HTTP Production Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Max Payload Limit for Photo / Document Uploads
    client_max_body_size 15M;

    # Nginx Internal Health Check
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # API Proxy Routing
    location /api/ {
        limit_req zone=global_limit burst=20 nodelay;
        proxy_pass http://backend_service/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Strict Rate Limit for Auth Login Endpoint
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend_service/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Static Proxy Routing
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
