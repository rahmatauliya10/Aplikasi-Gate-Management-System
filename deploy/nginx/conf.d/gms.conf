# HTTP Production Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker embedded DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Max Payload Limit for Photo / Document Uploads
    client_max_body_size 15M;

    # Nginx Internal Health Check
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # API Proxy Routing
    location /api/ {
        set $backend_url http://backend:3001;
        limit_req zone=global_limit burst=20 nodelay;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Strict Rate Limit for Auth Login Endpoint
    location /api/auth/login {
        set $backend_url http://backend:3001;
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Static Proxy Routing
    location / {
        set $frontend_url http://frontend:80;
        proxy_pass $frontend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
