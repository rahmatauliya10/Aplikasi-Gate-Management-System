services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    container_name: gate-system-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:3001:3001"
    container_name: gate-system-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gms}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BACKUP_SIGNATURE_SECRET=${BACKUP_SIGNATURE_SECRET}
      - JWT_ACCESS_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8081}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE_MB=10
      - DEFAULT_ADMIN_EMAIL=admin@gms.local
      - LOCAL_BACKUP_DIR=${LOCAL_BACKUP_DIR:-/app/backups/local}
      - OFFSITE_BACKUP_DIR=${OFFSITE_BACKUP_DIR:-/app/backups/nas}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - backups_local:/app/backups/local
      - backups_nas:/app/backups/nas
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    container_name: gate-system-migrator
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-gms}?schema=public
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - backups_local:/app/backups/local

  postgres:
    image: postgres:15.12-alpine
    container_name: gate-system-postgres
    restart: always
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      - POSTGRES_DB=${POSTGRES_DB:-gms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
  backups_local:
  backups_nas:
