services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    container_name: gate-system-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    container_name: gate-system-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/gms?schema=public
      # WARNING: Change these secrets before deploying to production!
      - JWT_ACCESS_SECRET=super_secret_access_key_gms
      - JWT_REFRESH_SECRET=super_secret_refresh_key_gms
      - JWT_ACCESS_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:8081
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE_MB=10
      - DEFAULT_ADMIN_EMAIL=admin@gms.local
      - DEFAULT_ADMIN_PASSWORD=admin123
      - DEFAULT_QC_PASSWORD=qc123
      - DEFAULT_WAREHOUSE_PASSWORD=warehouse123
      - DEFAULT_SECURITY_PASSWORD=security123
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: gate-system-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
